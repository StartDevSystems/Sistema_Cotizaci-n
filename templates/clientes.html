<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlueSky Energy — Clientes</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo 1.2.png') }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>
:root {
  --bg:    #07090f;
  --card:  #0e1520;
  --bdr:   rgba(255,255,255,0.07);
  --bdr2:  rgba(255,255,255,0.03);
  --text:  #f0f4ff;
  --sub:   #7a8899;
  --dim:   #33404f;
  --blue:  #4f9eff;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'Outfit', sans-serif; font-size: 18px;
  overflow-x: hidden; min-height: 100vh;
}

#bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.78; }
.shell { position: relative; z-index: 2; display: flex; min-height: 100vh; }

/* SIDEBAR */
.sidebar {
  width: 72px; position: fixed; left: 0; top: 0; bottom: 0;
  background: rgba(8,11,18,0.95); backdrop-filter: blur(28px);
  border-right: 1px solid var(--bdr);
  display: flex; flex-direction: column; align-items: center;
  padding: 28px 0; z-index: 100;
  transition: width 0.36s cubic-bezier(.22,1,.36,1);
}
.sidebar:hover { width: 240px; }
.sb-logo { width: 100%; display: flex; align-items: center; gap: 14px; padding: 0 20px; margin-bottom: 40px; overflow: hidden; }
.sb-name { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 0.14em; color: var(--text); white-space: nowrap; opacity: 0; transition: 0.2s; }
.sidebar:hover .sb-name { opacity: 1; }

.nav-link {
  width: 100%; display: flex; align-items: center; gap: 16px; padding: 18px 24px;
  text-decoration: none; color: var(--sub); font-size: 17px; font-weight: 500;
  transition: all 0.15s; white-space: nowrap; overflow: hidden;
  border-left: 2px solid transparent;
}
.nav-link.active { color: var(--text); border-left-color: var(--blue); background: rgba(79,158,255,0.08); }
.nav-ico { width: 28px; flex-shrink: 0; display: grid; place-items: center; }
.nav-ico svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.nav-txt { opacity: 0; transition: opacity 0.2s; }
.sidebar:hover .nav-txt { opacity: 1; }

/* MOBILE NAV */
.mobile-nav {
  display: none; position: fixed; bottom: 0; left: 0; right: 0;
  height: 68px; z-index: 200;
  background: rgba(8,11,18,0.97); backdrop-filter: blur(24px);
  border-top: 1px solid var(--bdr);
  align-items: center; justify-content: space-around; padding: 0 8px;
}
.mnav-btn {
  display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1;
  text-decoration: none; color: #7a8899; font-size: 11px; font-weight: 500; text-transform: uppercase;
}
.mnav-btn.active { color: var(--blue); }
.mnav-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; }

/* MAIN */
.main { margin-left: 72px; flex: 1; padding: 0 52px 120px; max-width: 1500px; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 40px 0 48px; }
.tb-section { font-family: 'Bebas Neue', sans-serif; font-size: 13px; letter-spacing: 0.26em; color: var(--dim); margin-bottom: 6px; }
.tb-title { font-size: 26px; font-weight: 600; color: var(--text); }

.panel { background: var(--card); border: 1px solid var(--bdr); border-radius: 20px; padding: 36px; }
.search-box {
  background: rgba(255,255,255,0.03); border: 1px solid var(--bdr); border-radius: 12px;
  padding: 14px 20px; color: white; width: 100%; outline: none; margin-bottom: 30px;
}

table { width: 100%; border-collapse: collapse; }
thead th { font-family: 'Bebas Neue', sans-serif; font-size: 13px; letter-spacing: 0.18em; color: var(--dim); text-align: left; padding: 0 0 18px; border-bottom: 1px solid var(--bdr); }
tbody td { padding: 18px 0; font-size: 15px; border-bottom: 1px solid var(--bdr2); }

.btn-blue {
  background: var(--blue); color: white; border: none; padding: 12px 24px; border-radius: 10px;
  font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.1em; cursor: pointer;
}

/* RESPONSIVE */
@media (max-width: 768px) {
  .sidebar { display: none; }
  .mobile-nav { display: flex; }
  .main { margin-left: 0; padding: 20px 15px 100px; }
  .topbar { flex-direction: column; align-items: flex-start; gap: 20px; padding: 30px 0; }
  .panel { padding: 20px; }
  .btn-blue { width: 100%; }
  .table-responsive { overflow-x: auto; display: block; width: 100%; }
}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="shell">
  <aside class="sidebar">
    <div class="sb-logo">
      <img src="{{ url_for('static', filename='img/logo 1.2.png') }}" alt="Logo" style="height: 32px;">
      <span class="sb-name">BlueSky Energy</span>
    </div>
    <nav class="nav-group">
      <a href="/dashboard" class="nav-link">
        <span class="nav-ico"><svg viewBox="0 0 24 24" style="width:20px; stroke:currentColor; stroke-width:1.8; fill:none;"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span>
        <span class="nav-txt">Dashboard</span>
      </a>
      <a href="/" class="nav-link">
        <span class="nav-ico"><svg viewBox="0 0 24 24" style="width:20px; stroke:currentColor; stroke-width:1.8; fill:none;"><path d="M12 5v14M5 12h14"/></svg></span>
        <span class="nav-txt">Nueva</span>
      </a>
      <a href="/cotizaciones" class="nav-link">
        <span class="nav-ico"><svg viewBox="0 0 24 24" style="width:20px; stroke:currentColor; stroke-width:1.8; fill:none;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></span>
        <span class="nav-txt">Cotizaciones</span>
      </a>
      <a href="/clientes" class="nav-link active">
        <span class="nav-ico"><svg viewBox="0 0 24 24" style="width:20px; stroke:currentColor; stroke-width:1.8; fill:none;"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></span>
        <span class="nav-txt">Clientes</span>
      </a>
    </nav>
  </aside>

  <nav class="mobile-nav">
    <a href="/dashboard" class="mnav-btn"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Panel</span></a>
    <a href="/" class="mnav-btn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Nueva</span></a>
    <a href="/cotizaciones" class="mnav-btn"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg><span>Listado</span></a>
    <a href="/clientes" class="mnav-btn active"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><span>Clientes</span></a>
  </nav>

  <main class="main">
    <div class="topbar">
      <div>
        <div class="tb-section">Sistema / Directorio</div>
        <div class="tb-title">Clientes Registrados</div>
      </div>
      <button class="btn-blue" onclick="document.getElementById('modal').style.display='grid'">+ NUEVO CLIENTE</button>
    </div>

    <div class="panel">
      <input type="text" class="search-box" id="search-clientes" placeholder="Buscar cliente...">
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Cliente</th>
              <th>Empresa</th>
              <th style="text-align:center">Docs</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="clientes-tbody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bg-canvas'), alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
const group = new THREE.Group(); scene.add(group);
const count = 60; const pos = new Float32Array(count*3);
for(let i=0; i<count*3; i++) pos[i] = (Math.random()-0.5)*10;
const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
group.add(new THREE.Points(geo, new THREE.PointsMaterial({size: 0.08, color: '#4f9eff'})));
camera.position.z = 5;
function anim() { requestAnimationFrame(anim); group.rotation.y += 0.001; renderer.render(scene, camera); } anim();

let todosLosClientes = [];
function cargarClientes() {
  fetch('/api/clientes').then(r => r.json()).then(data => {
    if (data.status === 'ok') { todosLosClientes = data.clientes; renderClientes(todosLosClientes); }
  });
}
function renderClientes(clientes) {
  const tbody = document.getElementById('clientes-tbody');
  tbody.innerHTML = '';
  clientes.forEach(c => {
    tbody.innerHTML += `<tr>
      <td><b>${c.nombre}</b></td>
      <td style="color:var(--sub)">${c.empresa || '-'}</td>
      <td style="text-align:center; color:var(--blue); font-family:'Bebas Neue';">${c.total_cotizaciones}</td>
      <td style="text-align:right"><button class="btn-blue" onclick="window.location.href='/cotizaciones?cliente=${encodeURIComponent(c.nombre)}'" style="padding:5px 12px">👁</button></td>
    </tr>`;
  });
}
document.getElementById('search-clientes').oninput = (e) => {
  const t = e.target.value.toLowerCase();
  renderClientes(todosLosClientes.filter(c => c.nombre.toLowerCase().includes(t) || (c.empresa && c.empresa.toLowerCase().includes(t))));
};
cargarClientes();
window.onresize = () => { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); };
</script>
</body>
</html>
