<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlueSky Energy — Cotizaciones</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo 1.2.png') }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>
:root {
  --bg:    #07090f;
  --card:  #0e1520;
  --bdr:   rgba(255,255,255,0.07);
  --bdr2:  rgba(255,255,255,0.03);
  --text:  #f0f4ff;
  --sub:   #7a8899;
  --dim:   #33404f;
  --blue:  #4f9eff;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'Outfit', sans-serif; font-size: 18px;
  overflow-x: hidden; min-height: 100vh;
  color-scheme: dark;
}

#bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.78; }
.shell { position: relative; z-index: 2; display: flex; min-height: 100vh; }

/* SIDEBAR */
.sidebar {
  width: 72px; position: fixed; left: 0; top: 0; bottom: 0;
  background: rgba(8,11,18,0.95); backdrop-filter: blur(28px);
  border-right: 1px solid var(--bdr);
  display: flex; flex-direction: column; align-items: center;
  padding: 28px 0; z-index: 100;
  transition: width 0.36s cubic-bezier(.22,1,.36,1);
}
.sidebar:hover { width: 240px; }
.sb-logo { width: 100%; display: flex; align-items: center; gap: 14px; padding: 0 20px; margin-bottom: 40px; overflow: hidden; }
.sb-name { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 0.14em; color: var(--text); white-space: nowrap; opacity: 0; transition: 0.2s; }
.sidebar:hover .sb-name { opacity: 1; }

.nav-link {
  width: 100%; display: flex; align-items: center; gap: 16px; padding: 18px 24px;
  text-decoration: none; color: var(--sub); font-size: 17px;
  transition: all 0.15s; white-space: nowrap; overflow: hidden;
  border-left: 2px solid transparent;
}
.nav-link.active { color: var(--text); border-left-color: var(--blue); background: rgba(79,158,255,0.08); }
.nav-ico { width: 28px; flex-shrink: 0; display: grid; place-items: center; }
.nav-ico svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.nav-txt { opacity: 0; transition: opacity 0.2s; }
.sidebar:hover .nav-txt { opacity: 1; }

/* MOBILE NAV */
.mobile-nav {
  display: none; position: fixed; bottom: 0; left: 0; right: 0;
  height: 68px; z-index: 200;
  background: rgba(8,11,18,0.97); backdrop-filter: blur(24px);
  border-top: 1px solid var(--bdr);
  align-items: center; justify-content: space-around; padding: 0 8px;
}
.mnav-btn {
  display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1;
  text-decoration: none; color: #7a8899; font-size: 11px; font-weight: 500; text-transform: uppercase;
}
.mnav-btn.active { color: var(--blue); }
.mnav-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; }

/* MAIN */
.main { margin-left: 72px; flex: 1; padding: 0 52px 120px; max-width: 1500px; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 40px 0 48px; }
.tb-section { font-family: 'Bebas Neue', sans-serif; font-size: 13px; letter-spacing: 0.26em; color: var(--dim); margin-bottom: 6px; }
.tb-title { font-size: 26px; font-weight: 600; color: var(--text); }

.filter-panel { background: var(--card); border: 1px solid var(--bdr); border-radius: 20px; padding: 25px; margin-bottom: 30px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; align-items: end; }
.f-input { width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--bdr); border-radius: 10px; padding: 10px 15px; color: white; outline: none; font-size: 14px; }

.cotizaciones-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
.c-card {
  background: var(--card); border: 1px solid var(--bdr); border-radius: 20px; padding: 25px;
  position: relative; transition: transform 0.2s, border-color 0.2s;
}
.c-card:hover { transform: translateY(-5px); border-color: var(--blue); }
.c-num { font-family: 'Bebas Neue', sans-serif; font-size: 14px; background: rgba(79,158,255,0.1); color: var(--blue); padding: 4px 10px; border-radius: 6px; }
.c-total { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: white; }

/* RESPONSIVE */
@media (max-width: 768px) {
  .sidebar { display: none; }
  .mobile-nav { display: flex; }
  .main { margin-left: 0; padding: 20px 15px 100px; }
  .topbar { padding: 30px 0; }
  .tb-title { font-size: 22px; }
  .filter-panel { grid-template-columns: 1fr; padding: 15px; }
  .cotizaciones-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="shell">
  <aside class="sidebar">
    <div class="sb-logo">
      <img src="{{ url_for('static', filename='img/logo 1.2.png') }}" alt="Logo" style="height: 32px;">
      <span class="sb-name">BlueSky Energy</span>
    </div>
    <nav class="nav-group">
      <a href="/dashboard" class="nav-link">
        <span class="nav-ico"><svg viewBox="0 0 24 24" style="width:20px; stroke:currentColor; stroke-width:1.8; fill:none;"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span>
        <span class="nav-txt">Dashboard</span>
      </a>
      <a href="/" class="nav-link">
        <span class="nav-ico"><svg viewBox="0 0 24 24" style="width:20px; stroke:currentColor; stroke-width:1.8; fill:none;"><path d="M12 5v14M5 12h14"/></svg></span>
        <span class="nav-txt">Nueva</span>
      </a>
      <a href="/cotizaciones" class="nav-link active">
        <span class="nav-ico"><svg viewBox="0 0 24 24" style="width:20px; stroke:currentColor; stroke-width:1.8; fill:none;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></span>
        <span class="nav-txt">Cotizaciones</span>
      </a>
      <a href="/clientes" class="nav-link">
        <span class="nav-ico"><svg viewBox="0 0 24 24" style="width:20px; stroke:currentColor; stroke-width:1.8; fill:none;"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></span>
        <span class="nav-txt">Clientes</span>
      </a>
    </nav>
  </aside>

  <nav class="mobile-nav">
    <a href="/dashboard" class="mnav-btn"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Panel</span></a>
    <a href="/" class="mnav-btn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Nueva</span></a>
    <a href="/cotizaciones" class="mnav-btn active"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg><span>Listado</span></a>
    <a href="/clientes" class="mnav-btn"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><span>Clientes</span></a>
  </nav>

  <main class="main">
    <div class="topbar">
      <div>
        <div class="tb-section">Sistema / Documentos</div>
        <div class="tb-title">Historial Guardado</div>
      </div>
    </div>

    <div class="filter-panel">
      <input type="text" class="f-input" id="search-input" placeholder="Buscar por cliente o número...">
      <input type="date" class="f-input" id="fecha-desde">
      <input type="date" class="f-input" id="fecha-hasta">
      <select class="f-input" id="filter-estado">
        <option value="">Todos los estados</option>
        <option value="Pendiente">Pendiente</option>
        <option value="Aprobada">Aprobada</option>
      </select>
    </div>

    <div id="loading" style="text-align:center; padding:50px; color:var(--sub);">Accediendo al servidor...</div>
    <div id="cotizaciones-container" class="cotizaciones-grid"></div>
  </main>
</div>

<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bg-canvas'), alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
const group = new THREE.Group(); scene.add(group);
const count = 60; const pos = new Float32Array(count*3);
for(let i=0; i<count*3; i++) pos[i] = (Math.random()-0.5)*10;
const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
group.add(new THREE.Points(geo, new THREE.PointsMaterial({size: 0.08, color: '#4f9eff'})));
camera.position.z = 5;
function anim() { requestAnimationFrame(anim); group.rotation.y += 0.001; renderer.render(scene, camera); } anim();

let todasLasCotizaciones = [];
function cargarData() {
  fetch('/api/cotizaciones').then(r => r.json()).then(data => {
    if (data.status === 'ok') { 
      todasLasCotizaciones = data.cotizaciones; 
      render(todasLasCotizaciones); 
      document.getElementById('loading').style.display = 'none';
    }
  });
}
function render(list) {
  const container = document.getElementById('cotizaciones-container');
  container.innerHTML = '';
  list.forEach(c => {
    container.innerHTML += `
      <div class="c-card">
        <div class="c-head">
          <span class="c-num">#${String(c.quote_number).padStart(3, '0')}</span>
          <span style="font-size:10px; text-transform:uppercase; color:var(--blue); font-weight:700;">${c.estado}</span>
        </div>
        <div style="font-size:18px; font-weight:600; margin-bottom:5px;">${c.cliente}</div>
        <div style="font-size:13px; color:var(--sub); margin-bottom:15px;">${c.fecha}</div>
        <div class="c-total">${c.total}</div>
        <div style="margin-top:20px; display:flex; gap:10px;">
          <a href="/descargar-pdf/${c.id}" class="btn-main" target="_blank" style="padding:8px 15px; font-size:12px; text-decoration:none; text-align:center;">PDF</a>
          <button onclick="duplicar('${c.id}')" style="background:rgba(255,255,255,0.05); border:1px solid var(--bdr); color:white; border-radius:10px; padding:0 15px; cursor:pointer;">📑</button>
        </div>
      </div>
    `;
  });
}
function duplicar(id) { fetch('/api/cotizaciones/'+id+'/duplicar', {method:'POST'}).then(() => cargarData()); }
document.getElementById('search-input').oninput = apply;
document.getElementById('fecha-desde').onchange = apply;
document.getElementById('fecha-hasta').onchange = apply;
document.getElementById('filter-estado').onchange = apply;
function apply() {
  const s = document.getElementById('search-input').value.toLowerCase();
  const d = document.getElementById('fecha-desde').value;
  const h = document.getElementById('fecha-hasta').value;
  const e = document.getElementById('filter-estado').value;
  const f = todasLasCotizaciones.filter(c => {
    const mS = c.cliente.toLowerCase().includes(s) || String(c.quote_number).includes(s);
    const mD = d ? c.fecha >= d : true;
    const mH = h ? c.fecha <= h : true;
    const mE = e ? c.estado === e : true;
    return mS && mD && mH && mE;
  });
  render(f);
}
cargarData();
window.onresize = () => { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); };
</script>
</body>
</html>
