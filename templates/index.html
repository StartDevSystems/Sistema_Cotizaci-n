<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Cotización - BlueSky Energy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --bluesky-dark-blue: #0d2a42;
            --bluesky-light-blue: #2cb0e8;
        }
        body {
            background-color: #f8f9fa;
        }
        .navbar-brand img {
            max-height: 40px;
        }
        .bg-primary { background-color: var(--bluesky-dark-blue) !important; }
        .btn-primary { background-color: var(--bluesky-dark-blue); border-color: var(--bluesky-dark-blue); }
        .btn-primary:hover { background-color: #0a2033; border-color: #0a2033; }
        .text-primary { color: var(--bluesky-dark-blue) !important; }
        
        .autocomplete-items {
            position: absolute;
            border: 1px solid #d4d4d4;
            border-bottom: none;
            border-top: none;
            z-index: 99;
            top: 100%;
            left: 0;
            right: 0;
            background-color: white;
            max-height: 200px;
            overflow-y: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .autocomplete-items div {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #d4d4d4;
        }
        .autocomplete-items div:hover {
            background-color: #e9ecef;
        }
        .autocomplete-active {
            background-color: #2cb0e8 !important;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <img src="{{ url_for('static', filename='img/logo.jpg') }}" alt="BlueSky Energy Logo" class="me-2">
                <span class="fs-5">BlueSky Energy - Sistema de Cotizaciones</span>
            </a>
            <div class="d-flex gap-2">
                <a href="/dashboard" class="btn btn-outline-light">
                    <i class="bi bi-speedometer2"></i> Dashboard
                </a>
                <a href="/cotizaciones" class="btn btn-outline-light">
                    <i class="bi bi-list-ul"></i> Cotizaciones
                </a>
                <a href="/clientes" class="btn btn-outline-light">
                    <i class="bi bi-people"></i> Clientes
                </a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4 mb-5">
        <div class="card shadow-lg">
            <div class="card-header bg-light d-flex justify-content-between align-items-center">
                <h4 class="mb-0 text-primary">Crear Nueva Cotización</h4>
                <button type="button" class="btn btn-outline-primary btn-sm" data-bs-toggle="modal" data-bs-target="#productosModal">
                    <i class="bi bi-box-seam"></i> Ver Productos
                </button>
            </div>
            <div class="card-body p-4">
                <form id="cotizacion-form">
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label for="cliente" class="form-label">Nombre del Cliente *</label>
                            <div class="position-relative">
                                <input type="text" class="form-control" id="cliente" placeholder="Ej: Juan Pérez" required autocomplete="off">
                                <div id="cliente-autocomplete" class="autocomplete-items"></div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <label for="fecha" class="form-label">Fecha</label>
                            <input type="date" class="form-control" id="fecha" required>
                        </div>
                        <div class="col-md-3">
                            <label for="estado" class="form-label">Estado</label>
                            <select class="form-select" id="estado">
                                <option value="Pendiente" selected>Pendiente</option>
                                <option value="Aprobada">Aprobada</option>
                                <option value="Rechazada">Rechazada</option>
                                <option value="En Revisión">En Revisión</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="mt-4">Conceptos</h5>
                        <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-toggle="modal" data-bs-target="#productosModal">
                            <i class="bi bi-plus-square"></i> Agregar desde Plantilla
                        </button>
                    </div>

                    <table class="table" id="items-table">
                        <thead class="table-light">
                            <tr>
                                <th scope="col" style="width: 50%;">Descripción</th>
                                <th scope="col">Cantidad</th>
                                <th scope="col">Precio Unitario</th>
                                <th scope="col">Total</th>
                                <th scope="col"></th>
                            </tr>
                        </thead>
                        <tbody id="items-tbody"></tbody>
                    </table>
                    <button type="button" class="btn btn-secondary btn-sm" id="add-row-btn">
                        <i class="bi bi-plus-circle"></i> Agregar Fila
                    </button>

                    <div class="row justify-content-end mt-4">
                        <div class="col-md-4 text-end">
                            <h4>Total General: <span id="total-general" class="fw-bold text-primary">$0.00</span></h4>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="notas" class="form-label">Notas (Opcional)</label>
                        <textarea class="form-control" id="notas" rows="2" placeholder="Observaciones adicionales..."></textarea>
                    </div>

                    <hr class="my-4">
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-save"></i> Guardar Cotización
                        </button>
                        <span id="download-buttons-area" style="display: none;">
                            <a href="#" id="pdf-download-link" class="btn btn-danger btn-lg" target="_blank">
                                <i class="bi bi-file-earmark-pdf"></i> PDF
                            </a>
                            <a href="#" id="excel-download-link" class="btn btn-success btn-lg">
                                <i class="bi bi-file-earmark-excel"></i> Excel
                            </a>
                        </span>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL DE PRODUCTOS -->
    <div class="modal fade" id="productosModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">
                        <i class="bi bi-box-seam"></i> Plantillas de Productos
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="d-flex justify-content-between mb-3">
                        <input type="text" class="form-control" id="search-productos" placeholder="Buscar producto..." style="max-width: 300px;">
                        <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#nuevoProductoModal">
                            <i class="bi bi-plus"></i> Nuevo Producto
                        </button>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>Descripción</th>
                                    <th>Precio</th>
                                    <th>Acción</th>
                                </tr>
                            </thead>
                            <tbody id="productos-tbody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL NUEVO PRODUCTO -->
    <div class="modal fade" id="nuevoProductoModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Nuevo Producto</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="form-nuevo-producto">
                        <div class="mb-3">
                            <label class="form-label">Nombre *</label>
                            <input type="text" class="form-control" name="nombre" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descripción *</label>
                            <textarea class="form-control" name="descripcion" rows="2" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Precio *</label>
                            <input type="number" class="form-control" name="precio" step="0.01" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btn-guardar-producto">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        // AUTOCOMPLETAR CLIENTES
        let clientesData = [];
        
        fetch('/api/clientes')
            .then(response => response.json())
            .then(data => {
                if (data.status === 'ok') {
                    clientesData = data.clientes;
                }
            });

        const clienteInput = document.getElementById('cliente');
        const autocompleteDiv = document.getElementById('cliente-autocomplete');

        clienteInput.addEventListener('input', function() {
            const val = this.value.toLowerCase();
            autocompleteDiv.innerHTML = '';
            
            if (!val) return;

            const matches = clientesData.filter(c => 
                c.nombre.toLowerCase().includes(val)
            ).slice(0, 5);

            matches.forEach(cliente => {
                const div = document.createElement('div');
                div.innerHTML = `<strong>${cliente.nombre}</strong>${cliente.empresa ? ` - ${cliente.empresa}` : ''}`;
                div.addEventListener('click', function() {
                    clienteInput.value = cliente.nombre;
                    autocompleteDiv.innerHTML = '';
                });
                autocompleteDiv.appendChild(div);
            });
        });

        document.addEventListener('click', function(e) {
            if (e.target !== clienteInput) {
                autocompleteDiv.innerHTML = '';
            }
        });

        // PRODUCTOS
        let productosData = [];

        function cargarProductos() {
            fetch('/api/productos')
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'ok') {
                        productosData = data.productos;
                        renderProductos(productosData);
                    }
                });
        }

        function renderProductos(productos) {
            const tbody = document.getElementById('productos-tbody');
            tbody.innerHTML = '';

            if (productos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">No hay productos</td></tr>';
                return;
            }

            productos.forEach(prod => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${prod.nombre}</strong></td>
                    <td>${prod.descripcion}</td>
                    <td>$${prod.precio.toFixed(2)}</td>
                    <td>
                        <button class="btn btn-sm btn-primary" onclick="agregarProducto('${prod.nombre}', '${prod.descripcion}', ${prod.precio})">
                            <i class="bi bi-plus"></i> Agregar
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function agregarProducto(nombre, descripcion, precio) {
            const tbody = document.getElementById('items-tbody');
            const newRow = document.createElement('tr');
            newRow.innerHTML = `
                <td><input type="text" class="form-control" name="descripcion" value="${descripcion}"></td>
                <td><input type="number" class="form-control item-calc" name="cantidad" value="1" min="1"></td>
                <td><input type="number" class="form-control item-calc" name="precio" value="${precio}" step="0.01" min="0"></td>
                <td><input type="text" class="form-control item-total" readonly value="$${precio.toFixed(2)}"></td>
                <td><button type="button" class="btn btn-danger btn-sm remove-row"><i class="bi bi-trash"></i></button></td>
            `;
            tbody.appendChild(newRow);
            
            bootstrap.Modal.getInstance(document.getElementById('productosModal')).hide();
            
            // Trigger update
            const event = new Event('input', { bubbles: true });
            newRow.querySelector('[name="cantidad"]').dispatchEvent(event);
        }

        document.getElementById('search-productos').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            const filtrados = productosData.filter(p => 
                p.nombre.toLowerCase().includes(term) || 
                p.descripcion.toLowerCase().includes(term)
            );
            renderProductos(filtrados);
        });

        document.getElementById('btn-guardar-producto').addEventListener('click', function() {
            const form = document.getElementById('form-nuevo-producto');
            const formData = new FormData(form);
            const data = Object.fromEntries(formData);

            fetch('/api/productos', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                if (result.status === 'ok') {
                    alert('Producto creado');
                    bootstrap.Modal.getInstance(document.getElementById('nuevoProductoModal')).hide();
                    form.reset();
                    cargarProductos();
                }
            });
        });

        cargarProductos();
    </script>
</body>
</html>
